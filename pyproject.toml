[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flags-train"
version = "0.1.0"
description = "Telegram bot for learning flags and countries with Anki-like quizzes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.18,<4.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "httpx>=0.28,<1.0",
  "orjson>=3.10,<4.0",
  "Pillow>=12.1,<13.0",
  "pydantic-settings>=2.8,<3.0",
  "sqlalchemy[asyncio]>=2.0.38,<3.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
