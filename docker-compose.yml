services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flags_train
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags_train"]
      interval: 10s
      timeout: 5s
      retries: 5

  data:
    build:
      context: .
    profiles: ["setup"]
    command: sh -c "python scripts/fetch_countries_data.py && python scripts/validate_countries_data.py"
    volumes:
      - ./data:/app/data

  migrate:
    build:
      context: .
    profiles: ["ops"]
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  sync:
    build:
      context: .
    profiles: ["ops"]
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: python scripts/sync_countries_to_db.py
    volumes:
      - ./data:/app/data

  preflight:
    build:
      context: .
    profiles: ["ops"]
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: python scripts/runtime_preflight.py
    volumes:
      - ./data:/app/data

  bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: python scripts/run_bot.py
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
