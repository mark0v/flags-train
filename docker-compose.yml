services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flags_train
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags_train"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.main"
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
